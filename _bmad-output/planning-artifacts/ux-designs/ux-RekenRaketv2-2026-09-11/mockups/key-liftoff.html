<!DOCTYPE html>
<!--
  Key-screen mock: Liftoff.
  Governed by: EXPERIENCE.md § Component Patterns (Liftoff row), § State
  Patterns (Daily Session complete row), § Key Flows Flow 1 climax step.
  Visual tokens: DESIGN.md § Components (rr-liftoff: perfect/steady/gentle
  accents). Design decision made in this mock (not yet in either spine):
  Flight Tiers are told apart, beyond accent color, by star count in the sky
  (3 / 2 / 1) rather than any text label — PRD FR-9 requires tiers to stay

<html lang="nl">
<head>
<meta charset="utf-8">
<title>RekenRaket — Liftoff (mock)</title>
<style>
  body { margin:0; padding:40px; background:#e7e5e4; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; display:flex; gap:40px; flex-wrap:wrap; }
  .frame { width:340px; height:460px; border-radius:28px; box-shadow:0 12px 30px rgba(11,29,58,0.18); padding:24px; box-sizing:border-box; position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
  .caption { width:340px; font-size:13px; color:#4B5A73; margin-top:8px; }
  .stars { position:absolute; top:24px; left:0; right:0; text-align:center; font-size:22px; letter-spacing:10px; }
  .rocket { font-size:64px; margin-bottom:36px; }
  .perfect { background:linear-gradient(#0B1D3A,#FFD65C); }
  .steady { background:linear-gradient(#0B1D3A,#5B8DEF); }
  .gentle { background:linear-gradient(#0B1D3A,#B79CED); }
</style>
</head>
<body>
  <div>
    <div class="frame perfect">
      <div class="stars">⭐⭐⭐</div>
      <div class="rocket">🚀</div>
    </div>
    <div class="caption">Liftoff — beste dag. Drie sterren + geel accent. Geen tekstlabel, geen percentage.</div>
  </div>
  <div>
    <div class="frame steady">
      <div class="stars">⭐⭐</div>
      <div class="rocket">🚀</div>
    </div>
    <div class="caption">Liftoff — gemengde dag. Twee sterren + blauw accent. Nog steeds een volledige liftoff.</div>
  </div>
  <div>
    <div class="frame gentle">
      <div class="stars">⭐</div>
      <div class="rocket">🚀</div>
    </div>
    <div class="caption">Liftoff — rustige dag. Eén ster + lila accent. Rustiger, nooit "mislukt".</div>
  </div>
</body>
</html>
